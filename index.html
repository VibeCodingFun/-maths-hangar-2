<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maths Hangar 2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="game-container">
        
        <div id="timer-container">
            Mission Time: <span id="timer-display">60</span>s
            <div id="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
        </div>

        <div id="question-area">
            <button id="next-btn" class="hidden">Next Question</button>
            <div id="question-display">Loading...</div>
            <input type="number" id="answer-input" class="answer-input" placeholder="Tap to answer" autocomplete="off">
        </div>

    </div>

    <div id="hangar-container" class="hidden">
        <h2 class="hangar-title">Your Hangar</h2>
        <div id="gallery" class="gallery-grid">
            </div>
    </div>
<!-- The Modal Overlay -->
<div id="exchange-modal" class="hidden">
    <div class="modal-content">
        <h2>Hand Full!</h2>
        <p>You found a new plane. Select a plane from your hand to swap it with, or discard the new one.</p>
        <div id="modal-hand-grid" class="gallery-grid"></div>
        <button id="discard-new-btn">Discard New Plane</button>
    </div>
</div>
    <script src="aircraft-db.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
