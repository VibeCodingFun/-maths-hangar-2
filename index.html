<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maths Hangar 2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="game-container">
        
        <div id="timer-container">
            Mission Time: <span id="timer-display">60</span>s
            <div id="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
        </div>

        <div id="question-area">
            <div id="question-display">Loading...</div>
            <input type="number" id="answer-input" class="answer-input" placeholder="Tap to answer" autocomplete="off">
        </div>

    </div>

    <div id="hangar-container" class="hidden">
        <h2 class="hangar-title">Your Hangar</h2>
        <div id="gallery" class="gallery-grid">
            </div>
    </div>
    <script src="aircraft-db.js"></script>
    <script src="app.js"></script>
</body>
</html>
